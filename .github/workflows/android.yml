name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'data/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          CMDBIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "cmdline-tools bin: $CMDBIN"
          echo "$CMDBIN" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$CMDBIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDBIN/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "----- installed platforms -----"
          ls "$SDK/platforms" || true
          echo "----- installed build-tools -----"
          ls "$SDK/build-tools" || true

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare signing key (permanent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android
          if gh release download signing-key --pattern exam.keystore --dir android --clobber > /dev/null 2>&1; then
            echo "keystore: restored from the permanent signing-key release"
          else
            echo "keystore: not found, creating a new permanent key"
            keytool -genkeypair -v -keystore android/exam.keystore -alias exam \
              -keyalg RSA -keysize 2048 -validity 12000 -storetype PKCS12 \
              -storepass examplatform -keypass examplatform \
              -dname "CN=Eng Ahmad Al-Zan, OU=Exam Platform, O=Exam Platform, L=Amman, C=JO"
            gh release create signing-key android/exam.keystore \
              --title "مفتاح توقيع التطبيق — لا تحذفه" \
              --notes "مفتاح التوقيع الدائم لتطبيق الأندرويد. وجوده ضروري لتثبيت التحديثات فوق النسخة القديمة بدون حذف النتائج." \
              > /dev/null 2>&1 || gh release upload signing-key android/exam.keystore --clobber > /dev/null 2>&1 || true
          fi
          ls -lh android/exam.keystore
          keytool -list -keystore android/exam.keystore -storepass examplatform | head -12

      - name: Copy the website into the app assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html data assets android/app/src/main/assets/www/
          echo "----- bundled website files -----"
          find android/app/src/main/assets/www -maxdepth 2 -type f | sort | head -30
          du -sh android/app/src/main/assets/www

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk exam-app.apk
          ls -lh exam-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exam-app-apk
          path: exam-app.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest exam-app.apk \
            --title "تطبيق الأندرويد — الإنتاج الحيواني (APK)" \
            --notes "نسخة محدثة تلقائياً من منصة الامتحان المحوسب — علوم الإنتاج الحيواني.
          إعداد وتصميم: المهندس أحمد الزن

          التحميل: من قسم Assets في هذه الصفحة (ملف exam-app.apk)
          التطبيق يعمل بدون إنترنت ويحفظ النتائج وبنك الأخطاء على الجهاز."
