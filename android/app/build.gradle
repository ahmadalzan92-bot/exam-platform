plugins {
  id 'com.android.application'
}

android {
  namespace 'com.ahmadalzan.exam'
  compileSdk 34

  defaultConfig {
    applicationId 'com.ahmadalzan.exam'
    minSdk 24
    targetSdk 34
    versionCode 3
    versionName '1.2'
    resConfigs 'ar', 'en'
  }

  // مفتاح التوقيع الدائم: ينشئه سير العمل مرة واحدة ويُستخدم دائماً
  // حتى تُثبَّت التحديثات فوق النسخة القديمة بدون فقدان النتائج.
  signingConfigs {
    release {
      storeFile file('../exam.keystore')
      storePassword 'examplatform'
      keyAlias 'exam'
      keyPassword 'examplatform'
    }
  }

  // The whole website is copied into src/main/assets/www by the build workflow.
  // Nothing is fetched from the internet at runtime apart from the optional web fonts.

  buildTypes {
    debug {
      applicationIdSuffix ''
    }
    release {
      minifyEnabled false
      shrinkResources false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
}
